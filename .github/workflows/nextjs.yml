# Build and deploy the KOBIS GLOBAL Next.js site to GitHub Pages.
# Uses static export (next.config.mjs: output: "export") → ./out, with basePath
# auto-injected by actions/configure-pages for project Pages.
name: Deploy KOBIS GLOBAL site to Pages

on:
  push:
    branches: ["claude/charming-clarke-1p93hb"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages and inject basePath for the Next.js static export.
          enablement: true
          static_site_generator: next
      - name: Install dependencies
        run: npm ci
      - name: Build (next build → static export)
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
